kind = "web"
previewPath = "/conta-fp360-landing/"
title = "CONTA FP360 — Descargas"
description = "Landing promocional en español de CONTA FP360 Studio y Aula, con información del producto y descargas gratuitas de versiones publicadas para Windows, Linux y macOS."
version = "1.0.0"
id = "artifacts/conta-fp360-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/conta-fp360-landing/" ]
localPort = 20871

[services.development]
run = "pnpm --filter @workspace/conta-fp360-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conta-fp360-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/conta-fp360-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20871"
BASE_PATH = "/conta-fp360-landing/"
