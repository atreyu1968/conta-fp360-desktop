# Ubuntu Server 24.04: Apache + libapache2-mod-php, sitio dedicado.
# Sustituir conta.ejemplo.org y las rutas TLS antes de activar.
<VirtualHost *:80>
    ServerName conta.ejemplo.org
    Redirect permanent / https://conta.ejemplo.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName conta.ejemplo.org
    DocumentRoot /var/www/conta-fp360/central/cpanel
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/conta.ejemplo.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/conta.ejemplo.org/privkey.pem

    SetEnv CONTA_CONFIG_FILE /etc/conta-fp360/config.php
    SetEnvIfNoCase Authorization "^(.+)$" HTTP_AUTHORIZATION=$1
    LimitRequestBody 73400320
    php_admin_flag display_errors Off
    php_admin_flag log_errors On
    php_admin_value post_max_size 64M
    php_admin_value memory_limit 256M
    php_admin_value session.cookie_secure 1

    <Directory /var/www/conta-fp360/central/cpanel>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        DirectoryIndex index.php
        Require all granted
        # Solo index y API son puntos de entrada PHP.
        <FilesMatch "^(?!(?:index|api)\.php$).*\.php$">
            Require all denied
        </FilesMatch>
        <FilesMatch "(?i)(^\.|^config|^schema\.|~$|\.(?:sqlite3?|db|bak|key|log|env|tmp|sql)$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/conta-fp360/central/cpanel/private>
        Require all denied
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    ErrorLog ${APACHE_LOG_DIR}/conta-central-error.log
    CustomLog ${APACHE_LOG_DIR}/conta-central-access.log combined
</VirtualHost>
