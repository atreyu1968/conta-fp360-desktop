/* CONTA FP360 v0.4: documentos visibles sin visor PDF del navegador */
.cfp-doc-preview{background:#f3f6fa;border:1px solid #dce5ee;border-radius:12px;min-width:0;overflow:hidden}

.cfp-doc-toolbar .btn{min-height:32px}
.cfp-paper-scroll{height:auto;max-height:min(74vh,960px);overflow:auto;padding:15px;background:#e8edf4;overscroll-behavior:contain}
.cfp-paper-shell{width:100%;margin:0 auto;min-width:0;max-width:none}
.cfp-paper-svg{display:block;width:100%;height:auto;background:#fff;box-shadow:0 8px 22px rgba(24,41,63,.18);user-select:text}
.cfp-doc-help{font-size:11px;color:#67788c;margin:0;padding:9px 12px;background:#fff}
.cfp-doc-preview.cfp-fullscreen{position:fixed;inset:8px;z-index:1500;display:flex;flex-direction:column;border-radius:12px;box-shadow:0 0 0 110vw #0d1a2caa}
.cfp-doc-preview.cfp-fullscreen .cfp-paper-scroll{flex:1;max-height:none;min-height:0}
.cfp-doc-preview.cfp-fullscreen .cfp-paper-shell{max-width:1100px}

/* v0.5 · Vista previa desplegable directamente debajo de cada documento */
.cfp-doc-list{display:grid;gap:10px;min-width:0}
.cfp-doc-row{min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}

.cfp-doc-trigger{display:flex;align-items:center;gap:13px;width:100%;padding:15px 17px;border:0;background:#fff;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.cfp-doc-trigger:hover{background:#f6f9fe}
.cfp-doc-trigger:focus-visible{outline:3px solid #7daee7;outline-offset:-3px}
.cfp-doc-row.open>.cfp-doc-trigger{background:#f1f6fc}
.cfp-doc-ident{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.cfp-doc-ident strong{font-size:13px;overflow-wrap:anywhere}
.cfp-doc-ident small{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.cfp-doc-symbol{display:grid;place-items:center;width:36px;height:40px;flex:0 0 auto;border-radius:8px;background:#eff4fb;color:#3268a9}
.cfp-doc-symbol svg{width:21px;height:21px}
.cfp-doc-toggle-icon{flex:0 0 auto;color:#647d99;width:19px;height:19px;transition:transform .2s}
.cfp-doc-row.open .cfp-doc-toggle-icon{transform:rotate(180deg)}
.cfp-doc-expanded{border-top:1px solid #dae4ef;background:#f9fbff;padding:16px;min-width:0}
.cfp-doc-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cfp-doc-actions .label{font-size:13px;font-weight:700;color:#304c6d}
.cfp-doc-actions .btnrow{display:flex;gap:7px;flex-wrap:wrap}
.cfp-doc-expanded .cfp-doc-preview{max-width:1100px;margin:0 auto}
.cfp-doc-expanded .cfp-paper-scroll{max-height:min(66vh,800px)}
.cfp-doc-expanded .hint{margin:12px 0 0}
@media(max-width:700px){
 .cfp-doc-trigger{padding:11px;gap:10px}

}

.cfp-journal-doc-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cfp-journal-doc-title{color:#284766;font-weight:700;font-size:13px;overflow-wrap:anywhere}
.cfp-journal-doc-bar .btnrow{display:flex;gap:7px;flex-wrap:wrap}
.cfp-journal-doc-body{min-width:0}

.cfp-journal-entry-docs .btn{font-size:11px;padding:7px 9px}

window.CONTA_DOC_PREVIEW=(()=>{
 const enc = s => String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const rgb=(r,g,b)=>`rgb(${[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(parseFloat(v)*255)))).join(',')})`;
 const unesc=s=>{let out='';for(let i=0;i<s.length;i++){if(s[i]==='\\'&&i<s.length-1){const c=s[++i];if('\\()'.includes(c))out+=c;else if(c==='n')out+='\n';else if(c==='r')out+='\r';else if(c==='t')out+='\t';else out+=c;}else out+=s[i];}return out;};
 function svgForBytes(bytes){
   if(!(bytes instanceof Uint8Array))bytes=new Uint8Array(bytes);
   if(bytes.length>4*1024*1024)return null;
   const text=new TextDecoder('windows-1252').decode(bytes);
   if(!text.startsWith('%PDF-')||!text.includes('%CONTAFP360'))return null;
   const s=text.match(/\bstream\r?\n([\s\S]*?)\r?\nendstream\b/);
   if(!s)return null;
   const shapes=['<rect x="0" y="0" width="595" height="842" fill="#fff"/>'];
   let n=0;
   for(const line of s[1].split(/\r?\n/)){
     if(++n>2000)break;
     let m=line.match(/^([\d.]+) ([\d.]+) ([\d.]+) rg BT \/(F[12]) ([\d.]+) Tf 1 0 0 1 ([\d.-]+) ([\d.-]+) Tm \((.*)\) Tj ET$/);
     if(m){const x=Number(m[6]), y=842-Number(m[7]);const label=enc(unesc(m[8]));const size=Number(m[5]);
       if(Number.isFinite(x)&&Number.isFinite(y)&&size>0&&size<60)shapes.push(`<text x="${x}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-size="${size}" font-weight="${m[4]==='F2'?'700':'400'}" fill="${rgb(m[1],m[2],m[3])}">${label}</text>`);
       continue;
     }
     m=line.match(/^([\d.]+) ([\d.]+) ([\d.]+) rg ([\d.-]+) ([\d.-]+) ([\d.-]+) ([\d.-]+) re f$/);
     if(m){shapes.push(`<rect x="${Number(m[4])}" y="${842-Number(m[5])-Number(m[7])}" width="${Number(m[6])}" height="${Number(m[7])}" fill="${rgb(m[1],m[2],m[3])}"/>`);continue;}
     m=line.match(/^([\d.]+) ([\d.]+) ([\d.]+) RG ([\d.]+) w ([\d.-]+) ([\d.-]+) m ([\d.-]+) ([\d.-]+) l S$/);
     if(m){shapes.push(`<line x1="${m[5]}" y1="${842-Number(m[6])}" x2="${m[7]}" y2="${842-Number(m[8])}" stroke="${rgb(m[1],m[2],m[3])}" stroke-width="${m[4]}"/>`);}
   }
   if(shapes.length<8)return null;
   return `<svg class="cfp-paper-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" role="img" aria-label="Vista compatible del documento">${shapes.join('')}</svg>`;
 }
 async function show(target,source,url,title){
   if(!target)return;
   target.innerHTML='<div class="notice">Preparando documento…</div>';
   try{
     const bytes=source instanceof Blob?new Uint8Array(await source.arrayBuffer()):source;
     if(!target.isConnected)return;
     const svg=svgForBytes(bytes);
     const label=enc(title||'Documento');
     target.innerHTML=`<div class="cfp-doc-preview">
       <div class="cfp-doc-toolbar"><span class="cfp-preview-label">${label}</span>
       <button type="button" class="btn small" data-cfp-zoom="out" title="Reducir">−</button>
       <span class="tag" data-cfp-zoom-level>100 %</span>
       <button type="button" class="btn small" data-cfp-zoom="in" title="Ampliar">+</button>
       <button type="button" class="btn small" data-cfp-expand title="Maximizar visor">Ampliar visor</button>
       <a class="btn small" target="_blank" rel="noopener noreferrer" href="${enc(url)}" title="Abrir el PDF original en una pestaña nueva">Abrir PDF ↗</a></div>
       <div class="cfp-paper-scroll">${svg?`<div class="cfp-paper-shell">${svg}</div>`:`<div class="cfp-error">Este PDF no utiliza el formato interno de CONTA FP360 y no puede previsualizarse aquí. Puede abrir o descargar el PDF original.</div>`}</div>
       <p class="cfp-doc-help">Vista compatible sin complemento PDF. El documento PDF original se conserva íntegro.</p>
       </div>`;
   }catch(err){
     if(target.isConnected)target.innerHTML=`<div class="notice danger">No se ha podido leer el documento: ${enc(err.message)}</div>`;
   }
 }
 document.addEventListener('click',e=>{
   const zoom=e.target.closest('[data-cfp-zoom]'),expand=e.target.closest('[data-cfp-expand]');
   const button=zoom||expand;if(!button)return;
   const viewer=button.closest('.cfp-doc-preview');if(!viewer)return;
   if(expand){const on=viewer.classList.toggle('cfp-fullscreen');expand.textContent=on?'Cerrar visor':'Ampliar visor';expand.setAttribute('aria-expanded',String(on));return;}
   const shell=viewer.querySelector('.cfp-paper-shell');if(!shell)return;
   let level=Number(shell.dataset.zoom||'100');level=Math.max(75,Math.min(250,level+(zoom.dataset.cfpZoom==='in'?25:-25)));
   shell.style.width=level+'%';shell.dataset.zoom=String(level);
   viewer.querySelector('[data-cfp-zoom-level]').textContent=level+' %';
 });

 return {show,svgForBytes};
})();

function cfpActivityGrade(a,solution,nivel,model){

   const original=model.get(a.operacionId);if(!original||!Array.isArray(original.lineas)||!original.lineas.length)return null;

   return Math.round(100*10*cfpEvalCompare(original.lineas,actual,nivel,'importe'))/100;
 }
 if(got===undefined)return 0;
 const expected=String(solution.respuesta??'').trim();
 if(a.tipo==='opcion')return got===expected?10:0;
 if(a.tipo==='multiple'){
   const expectedSet=new Set(expected.split('|').map(x=>x.trim()).filter(Boolean));const gotSet=new Set(Array.isArray(got)?got:[]);
   return expectedSet.size===gotSet.size&&[...expectedSet].every(x=>gotSet.has(x))?10:0;

 if(a.tipo==='orden'){const right=expected.split('|').map(x=>x.trim());return Array.isArray(got)&&right.length===got.length&&right.every((x,i)=>x===got[i])?10:0;}
 if(a.tipo==='numero'){
   const number=Number(String(got).replace(',','.')),correct=Number(expected.replace(',','.'));

 const a=String(code),n=Number(a.slice(0,2)),p=a.slice(0,3),f=a[0];
 if(f==='1'){
  if(a.startsWith('10')||a.startsWith('11')||a.startsWith('12')||p==='129'||a.startsWith('13')) return {side:'pn',title:'Fondos propios, subvenciones y otros componentes de patrimonio neto'};
  return {side:'pnc',title:'Provisiones y deudas a largo plazo'};
 }
 if(f==='2'){
  if(['280','281','282','290','291','292'].includes(p))return {side:'anc',title:'Inmovilizado (correcciones de valor)'};
  if(a.startsWith('20'))return {side:'anc',title:'I. Inmovilizado intangible'};
  if(a.startsWith('21'))return {side:'anc',title:'II. Inmovilizado material'};
  if(a.startsWith('22'))return {side:'anc',title:'III. Inversiones inmobiliarias'};
  return {side:'anc',title:'IV-V. Inversiones financieras a largo plazo'};
 }
 if(f==='3')return {side:'ac',title:'I. Existencias'};
 if(p==='480')return {side:'ac',title:'V. Periodificaciones a corto plazo'};
 if(p==='485')return {side:'pc',title:'V. Periodificaciones a corto plazo'};
 if(p==='474')return {side:'anc',title:'VI. Activos por impuesto diferido'};
 if(p==='479')return {side:'pnc',title:'Pasivos por impuesto diferido'};
 if(f==='4'){
  if(a.startsWith('40')||a.startsWith('41')||a.startsWith('465')||a.startsWith('475')||a.startsWith('476')||a.startsWith('477')||a.startsWith('499'))return {side:'pc',title:'IV. Acreedores comerciales y otras cuentas a pagar'};
  return {side:'ac',title:'II. Deudores comerciales y otras cuentas a cobrar'};
 }
 if(f==='5'){
  if(a.startsWith('57'))return {side:'ac',title:'VI. Efectivo y otros activos líquidos equivalentes'};
  if(a.startsWith('50')||a.startsWith('51')||a.startsWith('52')||a.startsWith('56')||a.startsWith('58'))return {side:'pc',title:'II-III. Deudas a corto plazo'};
  return {side:'ac',title:'III-IV. Inversiones financieras a corto plazo'};
 }
 return null;
}
function classifyPYG(c){

 if(a.startsWith('71')||a.startsWith('61'))return ['op','2. Variación de existencias'];
 if(a.startsWith('73'))return ['op','3. Trabajos realizados por la empresa para su activo'];
 if(a.startsWith('60'))return ['op','4. Aprovisionamientos'];
 if(['746'].includes(p))return ['op','9. Imputación de subvenciones de inmovilizado'];
 if(a.startsWith('74')||a.startsWith('75'))return ['op','5. Otros ingresos de explotación'];
 if(a.startsWith('64'))return ['op','6. Gastos de personal'];
 if(a.startsWith('68'))return ['op','8. Amortización del inmovilizado'];
 if(a.startsWith('62')||a.startsWith('63')||a.startsWith('65'))return ['op','7. Otros gastos de explotación'];
 if(a.startsWith('66'))return ['fin','13. Gastos financieros'];
 if(a.startsWith('76'))return ['fin','12. Ingresos financieros'];
 if(a.startsWith('668')||a.startsWith('768'))return ['fin','15. Diferencias de cambio'];
 if(a.startsWith('69')||a.startsWith('79'))return ['op','11. Deterioro y resultado por enajenaciones del inmovilizado / provisiones'];
 if(a.startsWith('77')||a.startsWith('67'))return ['op','11. Resultados por bajas y enajenaciones del inmovilizado'];
 if(a.startsWith('630')||a.startsWith('633')||a.startsWith('638'))return ['tax','18. Impuestos sobre beneficios'];

}

function amortize(values){
 const cost=Number(values.cost),residual=Number(values.residual),life=Number(values.life),start=String(values.start||''),cutoff=String(values.cutoff||''),kind=values.kind||'material';
 if(!Number.isFinite(cost)||cost<=0||!Number.isFinite(residual)||residual<0||residual>=cost)throw Error('Coste y valor residual inválidos.');
 if(!Number.isInteger(life)||life<1||life>100)throw Error('La vida útil debe ser de 1 a 100 años completos.');

 const first=daily(start),last=daily(cutoff),endDate=new Date(start+'T12:00:00Z');endDate.setUTCFullYear(endDate.getUTCFullYear()+life);
 const lastService=Math.floor(endDate.getTime()/86400000),deduct=cost-residual,annual=deduct/life;

   if(to<first)return 0;if(to>=lastService-1)return deduct;

 const before=money(untilDate(prev)),until=money(untilDate(last)),period=money(until-before);
 if(last<first||period<=0)throw Error('En el ejercicio indicado no hay amortización pendiente según las fechas.');

function periodify(v){

function calcResults(r){let title=r.tool==='amortizacion_v09'?'Dotación del periodo':'Ajuste de periodificación',metric=r.tool==='amortizacion_v09'?r.period:r.transfer;
 const table=r.tool==='amortizacion_v09'?`<div class="table-scroll"><table class="datatable"><thead><tr><th>Año</th><th class="num">Dotación</th><th class="num">Acumulada</th><th class="num">Valor neto</th></tr></thead><tbody>${r.schedule.map(a=>`<tr><td>${a.year}</td><td class="num">${euro(a.annual)}</td><td class="num">${euro(a.accum)}</td><td class="num">${euro(a.book)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="small">Días totales: ${r.days}. Días transcurridos al corte: ${r.elapsed}. Importe devengado: ${euro(r.earned)}. Importe futuro: ${euro(r.future)}.</p>`;
 return `<div class="v09-calc-result"><div class="v09-big-result"><span>${title}</span><strong>${euro(metric)}</strong></div>${table}<h3>Propuesta de asiento · ${esc(r.cutoff)}</h3><div class="table-scroll"><table class="datatable"><thead><tr><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>${r.lines.map(l=>`<tr><td>${esc(l.cuenta)}</td><td class="num">${l.debe?euro(l.debe):'—'}</td><td class="num">${l.haber?euro(l.haber):'—'}</td></tr>`).join('')}</tbody></table></div><div class="v09-account-links"><strong>Consultar saldos:</strong>${links([...new Set(r.lines.map(x=>x.cuenta))],r.cutoff,'calculadora')}</div><div class="controls"><button class="btn primary" data-v09="draftToDiary">Trasladar al diario como borrador</button><button class="btn" data-v09="exportCalc">Exportar cálculo JSON</button></div></div>`;
}
function transfer(r){if(!context().supuestoId)throw Error('Debe abrir primero un supuesto en Aula.');const closed=all().some(e=>e.sistema==='cierre'&&e.fecha.slice(0,4)===String(r.cutoff).slice(0,4));if(closed)throw Error('El ejercicio está cerrado. Reábralo antes de generar nuevos asientos.');
 api().showTab('diario');let f=$('#entryForm'),body=$('#entryLines');if(!f||!body)throw Error('No está disponible el editor del diario.');const prior=[...body.querySelectorAll('.line-row')],blank=prior.every(x=>!Number(x.querySelector('.line-debe')?.value||0)&&!Number(x.querySelector('.line-haber')?.value||0));if(blank)body.innerHTML='';
 for(const p of r.lines){const tr=document.createElement('tr');tr.className='line-row';tr.innerHTML=`<td><div class="cfp-account-cell"><input aria-label="Código de cuenta" list="account-list" class="account-input" value="${esc(p.cuenta)}" pattern="[0-9]{3,12}" required><button type="button" class="cfp-account-trigger" data-cfp-open="factura" aria-label="Calculadora relacionada">▦</button></div></td><td><input aria-label="Debe" type="number" step="0.01" min="0" class="line-debe" value="${p.debe}"></td><td><input aria-label="Haber" type="number" step="0.01" min="0" class="line-haber" value="${p.haber}"></td><td><button class="btn small danger" type="button" data-action="removeLine">×</button></td>`;body.appendChild(tr)}
 if(blank){f.elements.fecha.value=r.cutoff;f.elements.concepto.value=r.tool==='amortizacion_v09'?'Dotación amortización del inmovilizado':'Ajuste por periodificación'}
 window.CONTA_FP360_CALC_DRAFT={tipo:r.tool,detalle:r,nota:r.tool==='amortizacion_v09'?'Amortización '+r.kind:'Periodificación '+r.mode,fecha:r.cutoff};
 $('#v09-calc-overlay').style.display='none';document.body.classList.remove('v09-modal-open');let note=document.createElement('p');note.className='notice';note.textContent=`Se añadieron ${r.lines.length} partidas al borrador, sin borrar otros importes. Revise antes de registrar.`;body.closest('.table-scroll').after(note);f.scrollIntoView({block:'start'});
}
function exportJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function closeCalc(){const o=$('#v09-calc-overlay');if(o)o.style.display='none';document.body.classList.remove('v09-modal-open')}
function reportPrint(){const target=$('#content')?.querySelector('.panel:nth-of-type(2)');if(!target)return;const w=(window.CONTA_DESKTOP?.createPrintWindow?.() || window.open('','_blank'));if(!w){alert('No se pudo abrir la vista de impresión.');return}w.document.write(`<!doctype html><html lang="es"><meta charset="utf-8"><title>Estados CONTA FP360</title><style>body{font:12px Arial,sans-serif;padding:20px;color:#253850}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}.num{text-align:right}button,.controls{display:none}.v09-statement-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.v09-grand{font-weight:bold;margin-top:15px}.v09-subaccounts{display:none}</style><h1>${esc(context().empresa?.nombre||'Empresa simulada')}</h1><p>${esc(dates.state)} · Modelo PGC PYMES · SIMULACIÓN EDUCATIVA</p>${target.innerHTML}<script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function periodCalcLinks(){
 let res=$('#cfpa-result');if(!res||!res.querySelector('.cfpa-result')||res.querySelector('.v09-fiscal-accounts'))return;
 let model=$('#cfpa-form [name=model]')?.value||'',trimestre=Number($('#cfpa-form [name=quarter]')?.value||1),yr=Number($('#cfpa-form [name=year]')?.value||year());
 const preliquid=['420','303','111','115'].includes(model),months=['03','06','09','12'],day=['31','30','30','31'];
 const cut=preliquid?`${yr}-${months[trimestre-1]||'12'}-${day[trimestre-1]||'31'}`:finalDate(),rangeStart=`${yr}-${String((trimestre-1)*3+1).padStart(2,'0')}-01`;
 const allCodes=[...new Set(all().flatMap(e=>e.lineas||[]).map(l=>String(l.cuenta)))];
 let relevant;
 if(preliquid){
  relevant=model==='111'||model==='115'?allCodes.filter(c=>c.startsWith('4751')||c.startsWith('473')):allCodes.filter(c=>['472','477','4750','4700'].some(p=>c.startsWith(p)));
  if(!relevant.length)relevant=model==='111'||model==='115'?['4751']:['472','477'];
 }else{
  const f=$('#cfpa-form');const tool=f?.elements?.employee?'nomina':'factura';
  const operation=f?.elements?.operation?.value||'recibida';
  const given=[f?.elements?.account?.value,f?.elements?.counterpart?.value].filter(x=>/^\d{3,12}$/.test(String(x||'')));
  relevant=[...new Set([...given,...(tool==='nomina'?['640','642','476','4751','465']:operation==='recibida'?['472','4751']:['477','473'])])];
 }
 const box=document.createElement('section');box.className='v09-fiscal-accounts';
 box.innerHTML=`<h4>Mayores vinculados y saldo acumulado a ${esc(cut)}</h4><p class="hint">${preliquid?`La preliquidación se obtiene con movimientos de ${esc(rangeStart)} a ${esc(cut)}. Los enlaces muestran el saldo histórico hasta esa fecha.`:`Consulte las cuentas implicadas en el cálculo y sus saldos acumulados hasta ${esc(cut)}. La clasificación se debe revisar según el asiento generado.`}</p><div class="v09-ledger-list">${relevant.slice(0,12).map(c=>{
 let period=all().filter(e=>e.fecha>=rangeStart&&e.fecha<=cut&&e.sistema!=='cierre');let m=ledgerTotals(c,cut,period);let s=ledgerTotals(c,cut);
 return `<button data-v09="major" data-acc="${esc(c)}" data-cutoff="${esc(cut)}" data-source="${preliquid?'fiscal':'fiscalGeneral'}" class="v09-ledger-link"><strong>${esc(c)}</strong><span>${preliquid?`Trimestre: ${euro(m.debe)} / ${euro(m.haber)}`:'Consultar movimientos de la cuenta'}</span><b>Saldo ${euro(Math.abs(s.saldo))} ${s.saldo<0?'A':'D'} ↗</b></button>`}).join('')}</div>`;
 res.querySelector('.cfpa-result').appendChild(box);
}
function decorateQuick(){
 const target=$('#cfp-live');if(!target||!target.firstElementChild||target.querySelector('.v09-fiscal-accounts'))return;
 const form=$('#cfp-calc-form');if(!form)return;
 const kind=context().fiscalidad?.impuesto==='IVA'?'IVA':'IGIC';
 const codes=[...new Set(all().flatMap(e=>e.lineas||[]).map(l=>String(l.cuenta)).filter(c=>/^(472|477|4751|473)/.test(c)))];
 if(!codes.length)codes.push(kind==='IGIC'?'4727':'472',kind==='IGIC'?'4777':'477');
 const cutoff=finalDate();const el=document.createElement('div');el.className='v09-fiscal-accounts';el.innerHTML=`<h4>Cuentas fiscales relacionadas y saldo al ${esc(cutoff)}</h4><p class="hint">Pulse una cuenta para abrir su mayor, sin incluir el asiento de cierre.</p><div class="v09-ledger-list">${links(codes.slice(0,8),cutoff,'fiscalQuick')}</div>`;target.appendChild(el);
}
function decorateFiscal(){if($('#cfpa-overlay')?.style.display==='block')periodCalcLinks();decorateQuick();const center=$('#cfp-fiscal-center .cfp-center-grid');if(center&&!center.querySelector('[data-v09-tool]')){
 const oldAmort=center.querySelector('[data-cfp-open=amortizacion]');if(oldAmort)oldAmort.remove();
 const allowed=context().calculadoras||[],can=k=>!allowed.length||allowed.includes(k)||allowed.includes('todas')||allowed.includes('igic');
 for(const [id,label,summary] of [['amortizacion_v09','Amortización del inmovilizado','Cuadro anual y asiento de dotación 680/681/682.'],['periodificacion_v09','Ajustes por periodificación','Gastos e ingresos anticipados y devengados.']]){
 if(!can(id==='amortizacion_v09'?'amortizacion':'periodificacion'))continue;
 const b=document.createElement('button');b.className='cfp-calc-card';b.type='button';b.dataset.v09='openCalc';b.dataset.v09Tool=id;b.innerHTML=`<strong>${esc(label)}</strong><span>${esc(summary)}</span><i>Abrir →</i>`;center.appendChild(b)}}}
function decorateMajor(){
 const box=$('#content'),head=box?.querySelector('.grid-side .panel:nth-child(2)');if(!box||!head)return;
 const max=fiscalCutoff?.cutoff;
 if(max){
  const account=fiscalCutoff.account;
  const rows=all().filter(e=>e.fecha<=max&&e.sistema!=='cierre').flatMap(e=>(e.lineas||[]).filter(l=>String(l.cuenta)===String(account)).map((l,i)=>({fecha:e.fecha,id:e.id,concepto:e.concepto||'',debe:money(l.debe),haber:money(l.haber),index:i}))).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.id.localeCompare(b.id));
  const body=head.querySelector('tbody');let saldo=0;
  if(body)body.innerHTML=rows.length?rows.map(p=>{saldo=money(saldo+p.debe-p.haber);return `<tr><td>${esc(p.fecha.slice(8,10)+'/'+p.fecha.slice(5,7)+'/'+p.fecha.slice(0,4))}</td><td><button class="textlink" data-entry="${esc(p.id)}">${esc(p.id==='AS-INICIO'?'Apertura':p.id.slice(-8))}</button></td><td>${esc(p.concepto)}</td><td class="num">${p.debe?euro(p.debe):'—'}</td><td class="num">${p.haber?euro(p.haber):'—'}</td><td class="num">${euro(Math.abs(saldo))} ${saldo<0?'A':'D'}</td></tr>`}).join(''):'<tr><td colspan="6">Sin movimientos hasta la fecha seleccionada.</td></tr>';
  const latest=ledgerTotals(account,max);
  const bar=document.createElement('div');bar.className='v09-date-summary';bar.innerHTML=`<strong>Mayor a fecha ${esc(max)}</strong><span>Sumas: Debe ${euro(latest.debe)} · Haber ${euro(latest.haber)} · Saldo ${euro(Math.abs(latest.saldo))} ${latest.saldo<0?'acreedor':'deudor'} <small>(sin asiento de cierre)</small></span><button class="btn small" data-v09="clearMajor">Ver todos los movimientos</button>${returnFiscal?'<button class="btn small primary" data-v09="backFiscal">Volver al cálculo</button>':''}`;
  head.insertBefore(bar,head.querySelector('.table-scroll'));
  const total=head.querySelector('.doc-total strong');if(total)total.textContent=`${euro(Math.abs(latest.saldo))} ${latest.saldo<0?'acreedor':'deudor'} · a ${max}`;
 }else if(returnFiscal){const b=document.createElement('button');b.className='btn small';b.dataset.v09='backFiscal';b.textContent='Volver al cálculo';head.querySelector('.controls')?.appendChild(b)}
}
function reopen(){const yr=year();if(!confirm(`¿Eliminar los asientos de regularización y cierre de ${yr}? Los asientos ordinarios se conservarán.`))return;api().reopen(yr);fiscalCutoff=null;api().showTab('estados')}
function backFiscal(){const keep=returnFiscal;fiscalCutoff=null;returnFiscal=null;if(keep?.source==='estados'){api().showTab('estados');return;}api().showTab('fiscal');if(keep?.source==='fiscal'||keep?.source==='fiscalGeneral'){
 window.CONTA_FP360_AVANZADO?.open(keep.tool||'liquidacion');let form=$('#cfpa-form');if(form){for(const [k,v] of Object.entries(keep.form||{})){if(form.elements[k])form.elements[k].value=v}}}
 else if(keep?.source==='calculadora'){calcView(keep.tool||'amortizacion_v09')}else if(keep?.source==='fiscalQuick'){window.CONTA_FP360_CALCULADORAS?.open?.('factura')} }
function goMayor(a,cutoff,source){fiscalCutoff={account:a,cutoff};if(source==='fiscal'||source==='fiscalGeneral'){const f=$('#cfpa-form');returnFiscal={source,tool:source==='fiscal'?'liquidacion':$('#cfpa-form [name=employee]')?'nomina':'regimen',form:f?Object.fromEntries(new FormData(f)):returnFiscal?.form||{}};$('#cfpa-overlay .cfpa-close')?.click()}
 else if(source==='fiscalQuick'){returnFiscal={source};$('#cfp-calculator-overlay [data-cfp-act=close]')?.click()}
 else if(source==='calculadora'){returnFiscal={source,tool:lastDraft?.tool};closeCalc()}
 else if(source==='estados'){returnFiscal={source:'estados'}}
 api().gotoMayor(a,cutoff)}
function available(k){const allowed=context().calculadoras;if(!Array.isArray(allowed)||allowed.length===0)return true;return allowed.includes(k)||allowed.includes('todas')||allowed.includes('igic')||k==='amortizacion_v09'&&allowed.includes('amortizacion')}
function hook(){
 document.addEventListener('click',e=>{const t=e.target.closest('[data-cfp-tool=amortizacion]');if(t){e.preventDefault();e.stopImmediatePropagation();$('#cfp-calculator-overlay [data-cfp-act=close]')?.click();calcView('amortizacion_v09')}},true);
 document.addEventListener('click',e=>{
  const b=e.target.closest('#entryLines [data-cfp-open]');if(!b)return;
  const code=String(b.closest('.cfp-account-cell')?.querySelector('.account-input')?.value||'');
  const tool=/^(28[012]|68[012]|2[012])/.test(code)?'amortizacion_v09':/^(480|485|625|621|4109|4409)/.test(code)?'periodificacion_v09':null;
  if(!tool)return;
  const k=tool==='amortizacion_v09'?'amortizacion':'periodificacion';
  if(!available(k))return;
  e.preventDefault();e.stopImmediatePropagation();calcView(tool);
 },true);
 document.addEventListener('click',e=>{const b=e.target.closest('[data-v09]');if(!b)return;e.preventDefault();e.stopPropagation();const a=b.dataset.v09;
 try{
  if(a==='major'){goMayor(b.dataset.acc,b.dataset.cutoff||finalDate(),b.dataset.source);return}
  if(a==='stateMode'){dates.mode=b.dataset.mode;api().showTab('estados');return}
  if(a==='previewClosing'){previewClosing();return}
  if(a==='postClosing'){const p=createClosePlan(dates.state);if(!confirm('¿Registrar los asientos de regularización y cierre? Esta acción cerrará el ejercicio y bloqueará nuevos asientos hasta reabrirlo.'))return;api().addSystemEntries([p.regular,p.closing].filter(Boolean));api().showTab('estados');return}
  if(a==='reopen'){reopen();return}
  if(a==='openCalc'){if(!available(b.dataset.v09Tool==='amortizacion_v09'?'amortizacion':b.dataset.v09Tool))throw Error('La calculadora está desactivada por el profesor.');calcView(b.dataset.v09Tool);return}
  if(a==='closeCalc'){closeCalc();return}
  if(a==='draftToDiary'){if(!lastDraft)throw Error('Calcule primero.');transfer(lastDraft);return}
  if(a==='exportCalc'){if(!lastDraft)throw Error('Calcule primero.');exportJSON(`CONTA_FP360_${lastDraft.tool}_${lastDraft.cutoff}.json`,{app:'CONTA FP360',version:'0.9',...lastDraft});return}
  if(a==='printStates'){reportPrint();return}
  if(a==='clearMajor'){fiscalCutoff=null;api().showTab('mayor');return}
  if(a==='backFiscal'){backFiscal();return}
 }catch(err){alert(err.message)}
 },true);
 document.addEventListener('change',e=>{if(e.target?.id==='v09-state-date'){dates.state=e.target.value;api()?.showTab('estados')}if(e.target?.name==='mode'&&e.target.closest('#v09-calc-form')){const input=$('#v09-calc-form [name=account]');if(input&&['625','705'].includes(input.value))input.value=e.target.value.endsWith('income')?'705':'625'}},true);
 document.addEventListener('submit',e=>{if(e.target?.id!=='v09-calc-form')return;e.preventDefault();e.stopImmediatePropagation();try{const values=Object.fromEntries(new FormData(e.target));lastDraft=e.target.dataset.tool==='amortizacion_v09'?amortize(values):periodify(values);$('#v09-calc-output').innerHTML=calcResults(lastDraft)}catch(err){$('#v09-calc-output').innerHTML=`<div class="notice danger">${esc(err.message)}</div>`}},true);
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action="editEntry"],[data-action="removeEntry"]');if(!b)return;const ent=all().find(x=>x.id===b.dataset.id);if(ent?.sistema){e.preventDefault();e.stopImmediatePropagation();alert('Los asientos de regularización y cierre están protegidos. Utilice «Reabrir ejercicio» para eliminarlos conjuntamente.')}},true);
 const observer=new MutationObserver(()=>{if(window.__v09_decorating)return;window.__v09_decorating=true;try{decorateFiscal()}finally{window.__v09_decorating=false}});observer.observe(document.body,{subtree:true,childList:true});
}
function onRender(tab){if(tab==='mayor')decorateMajor();if(tab==='fiscal')decorateFiscal();}
function init(){try{dates.state=finalDate();dates.year=year();hook();}catch(e){console.error('v0.9 extension',e)}}
window.CONTA_FP360_V09={version:'0.9',statesView,reportData,createClosePlan,ledgerTotals,amortize,periodify,calcView,goMayor,onRender,periodCalcLinks,decorateFiscal,backFiscal};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script></body></html>
