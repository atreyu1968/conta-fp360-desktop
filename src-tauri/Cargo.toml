[package]
name = "conta-fp360-desktop"
version = "2.1.0"
description = "CONTA FP360: aplicaciones locales para FP"
authors = ["Francisco Javier González Rolo"]
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"

[lib]
name = "conta_fp360_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
